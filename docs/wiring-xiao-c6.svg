<rect x="55" y="170" width="450" height="55" rx="8" fill="#fff" stroke="#8da1b5" stroke-width="2"/>
<text x="75" y="204" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17283b" font-weight="normal" text-anchor="start">5V_P → sida 1 VCC · GND_P → sida 1 GND</text>
<rect x="905" y="170" width="640" height="55" rx="8" fill="#fff" stroke="#8da1b5" stroke-width="2"/>
<text x="925" y="204" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17283b" font-weight="normal" text-anchor="start">USB-C → XIAO → 3V3_L till AVR + ISO1540 sida 2</text>
<rect x="55" y="605" width="450" height="110" rx="8" fill="#fff" stroke="#8da1b5" stroke-width="2"/>
<text x="75" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17283b" font-weight="bold" text-anchor="start">Sida 1 → pumpen (I²C-master).</text>
<text x="75" y="664" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17283b" font-weight="normal" text-anchor="start">Nedre stiftrad / vänster STEMMA QT.</text>
<text x="75" y="692" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#17283b" font-weight="normal" text-anchor="start">Modulen har 10 kΩ-pullups och 100 nF.</text>
<rect x="600" y="605" width="945" height="110" rx="8" fill="#fff" stroke="#8da1b5" stroke-width="2"/>
<text x="620" y="634" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#17283b" font-weight="bold" text-anchor="start">Sida 2 → AVR. Övre stiftrad / högra STEMMA QT.</text>
<text x="620" y="663" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17283b" font-weight="normal" text-anchor="start">C1: 100 nF VDD–GND_L · C2: 100 nF VDDIO2–GND_L</text>
<text x="620" y="691" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#17283b" font-weight="normal" text-anchor="start">Modulen har 100 nF/sida · C5: 4,7 µF på 3V3_L vid AVR</text>
<rect x="25" y="775" width="1550" height="295" rx="8" fill="#fff" stroke="#b6c4d2" stroke-width="2"/>
<text x="48" y="812" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#17283b" font-weight="bold" text-anchor="start">Nät och villkor före lödning</text>
<text x="48" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#17283b" font-weight="normal" text-anchor="start">1. GND_P och GND_L hålls åtskilda. Pumpens 5 V kopplas inte till lokal USB/3V3.</text>
<text x="48" y="884" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#17283b" font-weight="normal" text-anchor="start">2. ISO1540 stöder 5 V/3,3 V och clock stretching. Sida 1 till pump, sida 2 till AVR.</text>
<text x="48" y="918" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#17283b" font-weight="normal" text-anchor="start">3. AVR:s båda matningspinnar kopplas till 3V3_L. MVIO- och BOD-inställningar kontrolleras.</text>
<text x="48" y="952" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#17283b" font-weight="normal" text-anchor="start">4. UPDI-programmerare ansluts endast lokalt med 3,3 V-signaler. PC3 är ledig.</text>
<text x="48" y="986" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#80521d" font-weight="normal" text-anchor="start">Inga extra I²C-pullups som utgångspunkt. Kortet har redan 10 kΩ på båda sidor.</text>
<text x="48" y="1030" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#566a7e" font-weight="normal" text-anchor="start">ISO154x-texten rättvänd anger övre/nedre rad. Koppla efter märkning. Se WIRING.md.</text>
</svg>