# Generic ESP32 DevKit example. Choose board and GPIOs for YOUR actual ESP32.
substitutions:
  device_name: thermia-duo
  tx_pin: GPIO17
  rx_pin: GPIO16
  de_pin: GPIO4

esphome:
  name: ${device_name}
  friendly_name: Thermia Duo

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  baud_rate: 0

uart:
  id: thermia_uart
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Tie DE and /RE together on this ESP32-side RS485 transceiver.
  flow_control_pin: ${de_pin}

modbus:
  id: thermia_bus
  uart_id: thermia_uart
  send_wait_time: 500ms

modbus_controller:
  - id: thermia
    address: 42
    modbus_id: thermia_bus
    update_interval: 10s
    max_cmd_retries: 2

packages:
  register_00: !include
    file: packages/raw-register.yaml
    vars:
      register_name: "00"
      value_address: "288"
      status_address: "289"
      age_address: "290"
