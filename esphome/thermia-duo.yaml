sensor:
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C register responses"
    address: 0x14
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C timeouts"
    address: 0x15
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C malformed frames"
    address: 0x16
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C accepted queries"
    address: 0x17
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
