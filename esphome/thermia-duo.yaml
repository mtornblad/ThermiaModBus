sensor:
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C register responses"
    address: 0x0104
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C timeouts"
    address: 0x0105
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C malformed frames"
    address: 0x0106
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: thermia
    name: "I2C accepted queries"
    address: 0x0107
    register_type: read
    value_type: U_WORD
    entity_category: diagnostic
    accuracy_decimals: 0
