[platformio]
default_envs = avr64dd28

[env]
platform = atmelmegaavr@1.10.0
board = AVR64DD28
framework = arduino
monitor_speed = 115200
platform_packages =
  framework-arduino-megaavr-dxcore @ https://github.com/mtornblad/DxCore.git#77292d36c7c7d1e7ca79bbfbfb61915554229657
lib_deps =
  https://github.com/arduino-libraries/ArduinoRS485.git#ea12d39a74ca37bb4e77d3bd1b3103b2f9b7dd76
  https://github.com/mtornblad/ArduinoModbus.git#591418a081d5afb896a4ec0dfacf5765a717163a
  https://github.com/mtornblad/ThermiaWire.git#7b5d408a7b0f3550f4e47b25c36deea48d0fce7b

; Build without assuming a programmer or a computer-specific serial port.
[env:avr64dd28]

[env:pymcuprog_upload]
upload_protocol = custom
; Override the port with pio run --upload-port ...
upload_port = /dev/ttyAMA1
upload_command = pymcuprog erase -d avr64dd28 -t uart -u $UPLOAD_PORT && pymcuprog write -f $SOURCE -d avr64dd28 -t uart -u $UPLOAD_PORT

[env:jtag2updi]
upload_protocol = jtag2updi
