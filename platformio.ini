; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:AVR64DD28]
platform = atmelmegaavr
board = AVR64DD28
framework = arduino
platform_packages =
    framework-arduino-megaavr-dxcore @ https://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@github.com/mtornblad/DxCore.git

lib_deps = 
	arduino-libraries/ArduinoRS485@^1.1.1
	arduino-libraries/ArduinoModbus@^1.0.9
    https://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@github.com/mtornblad/ThermiaWire.git

build_flags =
    -D CUSTOM_RS485_DEFAULT_DE_PIN=PIN_PC3
    -D CUSTOM_RS485_DEFAULT_RE_PIN=-1
    -D PIN_SERIAL1_TX=PIN_PC0
    -D RS485_SERIAL_PORT=Serial1
